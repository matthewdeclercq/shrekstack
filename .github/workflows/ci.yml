name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dead paths
        run: python3 skills/doc-sync/scripts/dead-paths.py --root . --doc-folder README.md --doc-folder skills

      - name: Dead-path tests
        run: python3 skills/doc-sync/scripts/test_dead_paths.py

      - name: Skill frontmatter
        run: python3 .github/skill_frontmatter.py

      - name: Links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress '**/*.md'
